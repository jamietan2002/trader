version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: swing_trader_postgres
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader_dev_password
      POSTGRES_DB: swing_trader
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d swing_trader"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swing_trader_app
    env_file:
      - .env.example
    environment:
      TRADING_MODE: paper
      API_HOST: 0.0.0.0
      API_PORT: 8080
    ports:
      - "8080:8080"
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python3", "main.py", "serve", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  pg_data:

