name: Autonomous Swing Trading Loop (Daily & Weekly)

# Triggered on-time ($0/mo) via External Edge Cron -> GitHub `workflow_dispatch` REST API
# (Cloudflare Workers Cron Trigger in `infrastructure/cloudflare_cron/` or `cron-job.org`).
# Native GitHub `on: schedule` is intentionally omitted to prevent 2-8h queue delays and dropped runs.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Workflow mode to execute (auto | daily | weekly | demo)"
        required: false
        default: "auto"

concurrency:
  group: autonomous-swing-trading-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autonomous-trading-cycle:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TRADING_MODE: paper
      MARKET_DATA_PROVIDER: alpaca
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_API_KEY_2: ${{ secrets.ALPACA_API_KEY_2 }}
      ALPACA_SECRET_KEY_2: ${{ secrets.ALPACA_SECRET_KEY_2 }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INPUT_MODE: ${{ github.event.inputs.mode }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Context & Safety Verification Suite
        run: |
          python3 .agents/skills/maintain-project-context/scripts/verify_context.py

      - name: Execute Autonomous Daily / Weekly Trading & Self-Improvement Loop
        run: |
          python3 - << 'EOF'
          import os
          from datetime import datetime, timezone
          from api.server import PlatformApplication

          app = PlatformApplication()

          # Ensure baseline strategies & historical dataset are initialized
          if not app.orchestrator.registry.list_strategies():
              print("[INIT] Bootstrapping baseline strategies and historical dataset...")
              app.orchestrator.bootstrap_baseline_system()

          mode = (os.environ.get("INPUT_MODE") or "auto").strip().lower()
          now_utc = datetime.now(timezone.utc)
          is_saturday_utc = now_utc.weekday() == 5
          today_str = now_utc.strftime("%Y-%m-%d")

          # Refresh latest market data up to today
          app.orchestrator.market_data.ingest_universe_and_history(
              start_date="2023-01-03",
              end_date=today_str,
          )

          # Determine latest actual bar_date ingested for SPY
          spy_bars = app.orchestrator.market_data.get_bars("SPY")
          session_date = spy_bars[-1].bar_date if spy_bars else "2025-06-27"

          if mode == "demo":
              from main import cmd_demo
              cmd_demo(app)
          elif mode == "weekly" or (mode == "auto" and is_saturday_utc):
              print(f"[WEEKLY] Running Weekly AI Strategy Discovery & Walk-Forward Validation for {session_date}...")
              app.orchestrator.run_daily_workflow(trading_date=session_date, force=False)
              app.orchestrator.run_weekly_workflow(week_ending_date=session_date, force=True)
          else:
              print(f"[DAILY] Running Daily Post-Close / Pre-Open / Market-Open Refresh for {session_date}...")
              app.orchestrator.run_daily_workflow(trading_date=session_date, force=False)
              app.orchestrator.run_pre_open_refresh(session_date=session_date)
          EOF

      - name: Commit & Push Updated Paper Account & Strategy Registry State
        run: |
          git config user.name "swing-trading-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/swing_trader.db
          if ! git diff --staged --quiet; then
            git commit -m "chore(state): autonomous paper trading & strategy registry update [skip ci]"
            git pull --rebase -X theirs origin main || git rebase --abort || true
            git push origin HEAD:main
            git push origin HEAD:feat/swing-trading-ai-platform || true
          else
            echo "No state changes to commit."
          fi
