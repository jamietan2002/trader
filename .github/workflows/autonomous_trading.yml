name: Autonomous Swing Trading Loop (Daily & Weekly)

# Triggered on exact US Eastern time ($0/mo) via the dedicated Cloudflare Worker
# (`infrastructure/cloudflare_cron/worker.js`) -> GitHub `workflow_dispatch` REST API.
# Native GitHub `on: schedule` is intentionally omitted (2-8h queue delays & dropped runs).
#
# Reliability design:
#   - Each dispatch names an explicit `stage`; the target trading session is derived from the
#     ET clock + exchange calendar inside `main.py scheduled` (never from what is already stored).
#   - A hard data-freshness gate re-fetches the final closing bars (cache-bypassed) and fails the
#     run (red X + GitHub failure email) instead of silently skipping when bars are stale/missing.
#   - Every stage also back-fills any missed post-close reviews from the last 5 sessions.
#   - Backstop dispatches (10:00 ET market_open, 18:00 ET post_close) are idempotent no-ops when
#     the primary run already succeeded, and self-heal when it did not.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Workflow mode (daily | weekly | demo) — legacy; prefer `stage`"
        required: false
        default: "daily"
      stage:
        description: "Scheduled stage (auto | pre_open | market_open | post_close | weekly)"
        required: false
        default: "auto"

concurrency:
  group: autonomous-swing-trading-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autonomous-trading-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TRADING_MODE: paper
      MARKET_DATA_PROVIDER: alpaca
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_API_KEY_2: ${{ secrets.ALPACA_API_KEY_2 }}
      ALPACA_SECRET_KEY_2: ${{ secrets.ALPACA_SECRET_KEY_2 }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INPUT_MODE: ${{ github.event.inputs.mode }}
      INPUT_STAGE: ${{ github.event.inputs.stage }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Context & Safety Verification Suite
        run: |
          python3 .agents/skills/maintain-project-context/scripts/verify_context.py

      - name: Execute Calendar-Driven Scheduled Stage
        run: |
          MODE="${INPUT_MODE:-daily}"
          STAGE="${INPUT_STAGE:-auto}"
          if [ "$MODE" = "demo" ]; then
            python3 main.py demo
          elif [ "$MODE" = "weekly" ] || [ "$STAGE" = "weekly" ]; then
            python3 main.py scheduled --stage weekly
          else
            python3 main.py scheduled --stage "$STAGE"
          fi

      - name: Commit & Push Updated Paper Account & Strategy Registry State
        if: always()
        run: |
          git config user.name "swing-trading-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/swing_trader.db
          if ! git diff --staged --quiet; then
            git commit -m "chore(state): autonomous paper trading & strategy registry update [skip ci]"
            git pull --rebase -X theirs origin main || git rebase --abort || true
            git push origin HEAD:main
            git push origin HEAD:feat/swing-trading-ai-platform || true
          else
            echo "No state changes to commit."
          fi
