name: Autonomous Swing Trading Loop (Daily & Weekly)

on:
  schedule:
    # Stage 1 (Post-Close): Monday-Friday at 21:30 UTC (5:30 AM SGT, after 4:00 PM ET / 5:00 AM SGT close)
    - cron: "30 21 * * 1-5"
    # Stage 2 (Pre-Open): Monday-Friday at 14:00 UTC (10:00 PM SGT / 9:00 AM EST) and 13:00 UTC (9:00 PM SGT / 9:00 AM EDT)
    - cron: "0 13,14 * * 1-5"
    # Stage 3 (Market-Open Live Paper Execution): Monday-Friday at 14:35 UTC (10:35 PM SGT / 9:35 AM EST) and 13:35 UTC (9:35 PM SGT / 9:35 AM EDT)
    - cron: "35 13,14 * * 1-5"
    # Weekly Self-Improving Strategy Discovery Loop: Saturday at 02:00 UTC (10:00 AM SGT)
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "Workflow mode to execute (auto | daily | weekly | demo)"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  autonomous-trading-cycle:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TRADING_MODE: paper
      MARKET_DATA_PROVIDER: alpaca
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Context & Safety Verification Suite
        run: |
          python3 .agents/skills/maintain-project-context/scripts/verify_context.py

      - name: Execute Autonomous Daily / Weekly Trading & Self-Improvement Loop
        run: |
          python3 - << 'EOF'
          import os
          from datetime import datetime, timezone
          from api.server import PlatformApplication
          from core.market_data.models import USTradingCalendar

          app = PlatformApplication()

          # Ensure baseline strategies & historical dataset are initialized
          if not app.orchestrator.registry.list_strategies():
              print("[INIT] Bootstrapping baseline strategies and historical dataset...")
              app.orchestrator.bootstrap_baseline_system()

          mode = os.environ.get("INPUT_MODE", "auto").strip().lower()
          today_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # Refresh latest market data up to today
          app.orchestrator.market_data.ingest_universe_and_history(
              start_date="2023-01-03",
              end_date=today_str,
          )

          # Determine latest actual bar_date ingested for SPY
          spy_bars = app.orchestrator.market_data.get_bars("SPY")
          session_date = spy_bars[-1].bar_date if spy_bars else "2025-06-27"

          if mode == "demo":
              from main import cmd_demo
              cmd_demo(app)
          elif mode == "weekly" or (mode == "auto" and datetime.now(timezone.utc).weekday() == 5):
              print(f"[WEEKLY] Running Weekly AI Strategy Discovery & Walk-Forward Validation for {session_date}...")
              app.orchestrator.run_daily_workflow(trading_date=session_date, force=False)
              app.orchestrator.run_weekly_workflow(week_ending_date=session_date, force=True)
          else:
              print(f"[DAILY] Running Daily Post-Close / Pre-Open Refresh for {session_date}...")
              app.orchestrator.run_daily_workflow(trading_date=session_date, force=False)
              app.orchestrator.run_pre_open_refresh(session_date=session_date)
          EOF

      - name: Commit & Push Updated Paper Account & Strategy Registry State
        run: |
          git config user.name "swing-trading-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/swing_trader.db
          if ! git diff --staged --quiet; then
            git commit -m "chore(state): autonomous paper trading & strategy registry update [skip ci]"
            git pull --rebase origin main || git rebase --abort || true
            git push origin HEAD:main
            git push origin HEAD:feat/swing-trading-ai-platform || true
          else
            echo "No state changes to commit."
          fi

